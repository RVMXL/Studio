name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static export
        run: bun run build:export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve export directory
        id: expdir
        run: |
          if [ -f ".next-export/index.html" ]; then
            echo "dir=.next-export" >> "$GITHUB_OUTPUT"
          elif [ -f "out/index.html" ]; then
            echo "dir=out" >> "$GITHUB_OUTPUT"
          elif [ -f ".next/index.html" ]; then
            echo "dir=.next" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Static export with index.html not found"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.expdir.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
